[workspace]
resolver = "2"
members = [
    "crates/vdrop-download",
    "crates/vdrop-media",
    "crates/vdrop-providers",
    "crates/vdrop-storage",
    "crates/vdrop-ytdlp",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
strip = true
