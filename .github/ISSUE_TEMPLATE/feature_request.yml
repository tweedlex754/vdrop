name: Feature request
description: Suggest something VDrop should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the situation, not the solution. Knowing what you were trying
        to accomplish often surfaces a simpler answer than the one asked for.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, sketch it here.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: >
        A workaround that already exists is useful information: it tells us how
        much the gap actually costs.
